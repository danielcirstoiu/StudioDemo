name: validate

on:
  workflow_dispatch:

env:
  CLI_VERSION: '1.0.0'
  PROJECT_DIR: 'projects/InvoiceProcessing.Performer'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UiPath CLI
        run: |
          npm install -g "@uipath/cli@${CLI_VERSION}"
          uip --version

      - name: Help - rpa
        run: uip rpa --help

      - name: Help - analyze
        run: uip rpa analyze --help

      - name: Help - pack
        run: uip rpa pack --help

      - name: Help - restore
        run: uip rpa restore --help
